<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="flame" x1="80" y1="5" x2="20" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="50%" stop-color="#FF4400"/>
      <stop offset="100%" stop-color="#CC1100"/>
    </linearGradient>
  </defs>

  <!-- K stem — double black bar (brand DNA shows two tight verticals) -->
  <rect x="8" y="8" width="13" height="84" rx="2" fill="#0A0A0A"/>
  <rect x="23" y="8" width="5" height="84" rx="1" fill="#0A0A0A"/>

  <!-- Orange arm sweeping upper-right: wide organic triangle flowing from stem top -->
  <path d="M28 8 C 50 8, 88 8, 88 8 C 88 16, 60 32, 36 50 L 28 50 Z"
        fill="url(#flame)"/>

  <!-- Orange leg sweeping lower-right: mirrors arm from stem bottom -->
  <path d="M28 52 L 36 52 C 60 68, 88 84, 88 92 C 88 92, 50 92, 28 92 Z"
        fill="url(#flame)"/>

  <!-- Black cut-out to punch K negative space into upper arm -->
  <path d="M28 14 L 72 14 C 76 14 76 20 73 22 L 38 46 L 28 46 Z"
        fill="#0A0A0A"/>

  <!-- Black cut-out for lower leg -->
  <path d="M28 58 L 38 58 L 73 78 C 76 80 76 86 72 86 L 28 86 Z"
        fill="#0A0A0A"/>

  <!-- Sparkle dot at the K joint -->
  <circle cx="33" cy="51" r="3.5" fill="#FF6A00"/>
</svg>
