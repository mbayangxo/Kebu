name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-chain:
    name: TypeScript → Lint → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 — TypeScript
        run: npm run typecheck

      - name: Gate 2 — Lint
        run: npm run lint

      - name: Gate 3–6 — Tests (unit + integration/db/rls by filename)
        run: npm test

      - name: Gate 7 — Production build
        run: npm run build

  e2e:
    name: E2E (staging)
    runs-on: ubuntu-latest
    needs: gate-chain
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true # enable as required once staging URL + secrets exist

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          KEBU_E2E_BASE_URL: ${{ secrets.KEBU_E2E_BASE_URL }}
