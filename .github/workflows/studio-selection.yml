name: Studio selection browser

on:
  workflow_dispatch:
  push:
    branches: ["work/kebu-completion-audit-oct13", "work/codex-yande-experience-oct22", "work/codex-yande-reconcile-oct22", "work/codex-studio-marquee-oct22", "work/codex-resume-oct23", "work/codex-studio-pages-oct23", "work/codex-studio-arrange-oct23", "work/codex-studio-snapping-oct23", "work/codex-studio-group-rotation-oct23", "work/codex-studio-snap-controls-oct24"]
    paths: ["app/**", "lib/**", "tests/**", "scripts/verify-studio-local-ui.mjs", "package*.json", ".github/workflows/studio-selection.yml"]

permissions:
  contents: read

jobs:
  studio-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install actual Chromium
        run: npx playwright install --with-deps chromium
      - name: Require the original interaction regression
        shell: bash
        run: |
          set -euo pipefail
          export KEBU_CHROMIUM_EXECUTABLE_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          export KEBU_STUDIO_UI_OUTPUT_DIR="$RUNNER_TEMP/studio-marquee-before"
          export KEBU_STUDIO_UI_GREP="marquee selects visible layers"
          cp app/components/studio/studio-canvas-editor.tsx "$RUNNER_TEMP/studio-component-after.tsx"
          cp tests/studio/save-export.local.spec.ts "$RUNNER_TEMP/studio-spec-after.ts"
          trap 'cp "$RUNNER_TEMP/studio-component-after.tsx" app/components/studio/studio-canvas-editor.tsx; cp "$RUNNER_TEMP/studio-spec-after.ts" tests/studio/save-export.local.spec.ts' EXIT
          git show 053510adf1b2a7a00421d752d3bfb947ad90b525:app/components/studio/studio-canvas-editor.tsx > app/components/studio/studio-canvas-editor.tsx
          git show 8753103c005477af4651a2ec58bbcbed7beacde7:tests/studio/save-export.local.spec.ts > tests/studio/save-export.local.spec.ts
          set +e
          node scripts/verify-studio-local-ui.mjs
          result=$?
          set -e
          test "$result" -ne 0
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(readFileSync(process.env.KEBU_STUDIO_UI_OUTPUT_DIR+'/results.json','utf8'));
          assert.equal(r.stats.expected,0);assert.equal(r.stats.unexpected,1);assert.equal(r.stats.skipped,0);assert.equal(r.stats.flaky,0);
          const errors=JSON.stringify(r.suites);
          assert(errors.includes('2 layers selected.'));assert(errors.includes('toBeVisible'));
          assert(!errors.includes('executable doesn'));
          console.log(JSON.stringify({originalMarqueeFailureReproduced:true,unexpected:1,skipped:0}));
          NODE
      - name: Require the original missing shared rotation control
        shell: bash
        run: |
          set -euo pipefail
          export KEBU_CHROMIUM_EXECUTABLE_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          export KEBU_STUDIO_UI_OUTPUT_DIR="$RUNNER_TEMP/studio-group-rotation-before"
          export KEBU_STUDIO_UI_GREP="selection rotation has a shared"
          cp app/components/studio/studio-canvas-editor.tsx "$RUNNER_TEMP/studio-rotation-component-after.tsx"
          trap 'cp "$RUNNER_TEMP/studio-rotation-component-after.tsx" app/components/studio/studio-canvas-editor.tsx' EXIT
          git show b9acdc0217c8f90be61cb4ba9ab9eb316d487ff8:app/components/studio/studio-canvas-editor.tsx > app/components/studio/studio-canvas-editor.tsx
          set +e
          node scripts/verify-studio-local-ui.mjs
          result=$?
          set -e
          test "$result" -ne 0
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(readFileSync(process.env.KEBU_STUDIO_UI_OUTPUT_DIR+'/results.json','utf8'));
          assert.equal(r.stats.expected,0);assert.equal(r.stats.unexpected,1);assert.equal(r.stats.skipped,0);assert.equal(r.stats.flaky,0);
          const errors=JSON.stringify(r.suites);
          assert(errors.includes('Rotate selection'));assert(errors.includes('toBeVisible'));assert(errors.includes('element(s) not found'));
          console.log(JSON.stringify({originalSharedRotationFailureReproduced:true,unexpected:1,skipped:0}));
          NODE
      - name: Require three independent phone and tablet touch passes
        shell: bash
        run: |
          set -euo pipefail
          export KEBU_CHROMIUM_EXECUTABLE_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          for iteration in 1 2 3; do
            export KEBU_STUDIO_UI_OUTPUT_DIR="$RUNNER_TEMP/studio-touch-$iteration"
            KEBU_STUDIO_UI_GREP='touch transforms at' node scripts/verify-studio-local-ui.mjs
            node --input-type=module - "$KEBU_STUDIO_UI_OUTPUT_DIR/results.json" <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(readFileSync(process.argv[2],'utf8'));
          assert.equal(r.stats.expected,2);assert.equal(r.stats.unexpected,0);assert.equal(r.stats.skipped,0);assert.equal(r.stats.flaky,0);
          NODE
          done
      - name: Verify actual Studio selection, editing, drafts, history and decoded exports
        shell: bash
        run: |
          set -euo pipefail
          export KEBU_CHROMIUM_EXECUTABLE_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          export KEBU_STUDIO_UI_OUTPUT_DIR="$RUNNER_TEMP/studio-marquee-after"
          node scripts/verify-studio-local-ui.mjs
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(readFileSync(process.env.KEBU_STUDIO_UI_OUTPUT_DIR+'/results.json','utf8'));
          assert.equal(r.stats.expected,65);assert.equal(r.stats.unexpected,0);assert.equal(r.stats.skipped,0);assert.equal(r.stats.flaky,0);
          console.log(JSON.stringify({studioPassed:65,skipped:0,flaky:0,syntheticLoopbackAuth:true,managedHostedAuthAccepted:false}));
          NODE
      - name: Retain isolated browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-selection-browser-evidence
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/studio-touch-*
            ${{ runner.temp }}/studio-marquee-before
            ${{ runner.temp }}/studio-marquee-after

