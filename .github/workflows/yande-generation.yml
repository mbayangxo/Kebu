name: Yande generation transport and authority

on:
  workflow_dispatch:
  push:
    branches: ["work/kebu-completion-audit-oct13", "work/codex-yande-reconcile-oct22"]
    paths: ["app/api/studio/**", "app/api/projects/create-website/**", "lib/yande/**", "lib/studio/ai-generate.ts", "lib/studio/campaign-project.ts", "lib/create/ai-generate.ts", "tests/yande/**", "tests/studio/generation-authority.test.ts", "package*.json", ".github/workflows/yande-generation.yml"]

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Prove original generation and quota failures
        shell: bash
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/kebu-yande-original"
          git worktree add --detach "$original" 49c139b2d9dedfb974e4ed907403a716c0b656b0
          ln -s "$GITHUB_WORKSPACE/node_modules" "$original/node_modules"
          cp tests/yande/generation-transport.test.ts "$original/tests/yande/generation-transport.test.ts"
          cp tests/studio/generation-authority.test.ts "$original/tests/studio/generation-authority.test.ts"
          set +e
          (cd "$original" && node "$GITHUB_WORKSPACE/node_modules/vitest/vitest.mjs" run tests/yande/generation-transport.test.ts tests/studio/generation-authority.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/yande-before.json")
          result=$?
          set -e
          test "$result" -ne 0
          node --input-type=module - "$RUNNER_TEMP/yande-before.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const report=JSON.parse(readFileSync(process.argv[2],'utf8'));
          assert.equal(report.numTotalTests,24);assert.equal(report.numFailedTests,18);assert.equal(report.numPassedTests,6);assert.equal(report.numPendingTests,0);
          const failures=report.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status==='failed');
          assert(failures.some(t=>t.title.includes('allowance is exhausted')));
          assert.equal(failures.filter(t=>t.title.includes('cross-origin')).length,2);
          assert(failures.some(t=>t.title.includes('records its authenticated owner')));
          console.log('Original transport, quota and origin regressions reproduced:18 failures/6 passes.');
          NODE
      - name: Verify repaired SDK HTTP transport and authenticated route authority
        run: |
          npx vitest run tests/yande/generation-transport.test.ts tests/studio/generation-authority.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/yande-after.json"
          node --input-type=module - "$RUNNER_TEMP/yande-after.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const report=JSON.parse(readFileSync(process.argv[2],'utf8'));
          assert.equal(report.numTotalTests,24);assert.equal(report.numPassedTests,24);assert.equal(report.numFailedTests,0);assert.equal(report.numPendingTests,0);
          NODE
      - name: Install isolated SQL runtime
        run: npm install --prefix "$RUNNER_TEMP/kebu-yande-runtime" --ignore-scripts --no-save --package-lock=false @electric-sql/pglite@0.5.10
      - name: Verify actual usage-table SQL and owner boundaries
        run: |
          export KEBU_LOCAL_PGLITE_ROOT="$RUNNER_TEMP/kebu-yande-runtime/node_modules/@electric-sql/pglite"
          npx vitest run tests/yande/interactions.local.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/yande-sql.json"
          node --input-type=module - "$RUNNER_TEMP/yande-sql.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const report=JSON.parse(readFileSync(process.argv[2],'utf8'));
          assert.equal(report.numTotalTests,4);assert.equal(report.numPassedTests,4);assert.equal(report.numFailedTests,0);assert.equal(report.numPendingTests,0);
          NODE
      - name: Retain isolated generation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yande-generation-evidence
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/yande-before.json
            ${{ runner.temp }}/yande-after.json
            ${{ runner.temp }}/yande-sql.json
