name: Native PostgreSQL races

on:
  push:
    branches: ["work/**", "claude/**", main]
    paths:
      - ".github/workflows/native-postgres.yml"
      - "tests/creative-core/**"
      - "lib/create/**"
      - "supabase/migrations/**"
      - "package-lock.json"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-races:
    name: Independent PostgreSQL sessions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Official postgres:17.6 manifest, verified against Docker Registry.
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kebu_disposable_ci_only
          POSTGRES_DB: kebu_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kebu_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Fixture-only credentials. Never replace this with a hosted database URL.
      KEBU_PUBLISH_CONCURRENCY_DATABASE_URL: postgresql://postgres:kebu_disposable_ci_only@127.0.0.1:5432/kebu_qa
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Native publish and shared-budget lock barriers
        run: >-
          npx vitest run
          tests/creative-core/kcd-publish-concurrency.local.test.ts
          tests/creative-core/experience-concurrency.local.test.ts
          --reporter=default --reporter=json --outputFile=native-postgres-results.json
      - name: Require all nine cases and confirm database cleanup
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import pg from 'pg';
          const report = JSON.parse(readFileSync('native-postgres-results.json', 'utf8'));
          assert.equal(report.numTotalTests, 9);
          assert.equal(report.numPassedTests, 9);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.numFailedTests, 0);
          const db = new pg.Client({ connectionString: process.env.KEBU_PUBLISH_CONCURRENCY_DATABASE_URL });
          await db.connect();
          try {
            const version = (await db.query('show server_version')).rows[0].server_version;
            assert.match(version, /^17\.6(?:\D|$)/);
            const leftovers = await db.query("select datname from pg_database where starts_with(datname, '_kebutest_publish_') or starts_with(datname, '_kebutest_experience_')");
            assert.deepEqual(leftovers.rows, []);
            console.log(JSON.stringify({ postgres: version, passed: 9, skipped: 0, databasesCleaned: true }));
          } finally { await db.end(); }
          JS
